[project]
name = "box"
version = "0.3.0"
description = "Portable development environments over Tailscale SSH"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "modal>=1.6.3",
    "click>=8.1,<9",
]

[project.scripts]
box = "box.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
