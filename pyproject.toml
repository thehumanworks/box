[project]
name = "box"
version = "0.3.0"
description = "Portable development environments over Tailscale SSH"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "modal>=1.6.3,<1.7",
    "click>=8.1,<9",
]

[project.scripts]
box = "box.cli:main"

[project.optional-dependencies]
remote = [
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
