# Builds the base image once, pushes the same image to both registries, and starts a
# sandbox from it on each provider.
#
# Required configuration (Settings > Secrets and variables > Actions):
#   Modal:   secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET
#   Vercel:  secret VERCEL_TOKEN, variables VERCEL_TEAM (team slug) and VERCEL_PROJECT (project name)
# The Vercel steps are skipped while VERCEL_TEAM is not set.
name: image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GitHub Container Registry needs a lower-case name, so the repository name must be lower-case.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}/base
  # Vercel Sandbox pulls only from Vercel Container Registry. The image belongs to a project.
  VCR_IMAGE: vcr.vercel.com/${{ vars.VERCEL_TEAM }}/${{ vars.VERCEL_PROJECT }}/base

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Vercel Container Registry
        if: vars.VERCEL_TEAM != ''
        uses: docker/login-action@v4
        with:
          registry: vcr.vercel.com
          username: ${{ vars.VERCEL_TEAM }}
          password: ${{ secrets.VERCEL_TOKEN }}

      # One build, two names. Both registries receive the same manifest, so one digest
      # identifies the image on both providers. Layers use gzip, which both providers accept.
      # Provenance and SBOM attestations are off, because they turn the image into an index.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: image
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ vars.VERCEL_TEAM != '' && format('{0}:{1}', env.VCR_IMAGE, github.sha) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-modal:
    name: Smoke test on Modal
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the smoke test
        run: node src/smoke.ts --provider modal --image "${GHCR_IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

  smoke-vercel:
    name: Smoke test on Vercel Sandbox
    needs: build
    if: vars.VERCEL_TEAM != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the smoke test
        run: node src/smoke.ts --provider vercel --image "${VCR_IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
